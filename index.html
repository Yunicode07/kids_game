<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>몽실이와 놀이터</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFF3D6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="몽실이">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#FFFBF3;color:#2A2622;font-family:'Noto Sans KR',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit}
.jua{font-family:'Jua',sans-serif;font-weight:400}
#app{position:fixed;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column}
#stage{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vh)*3);padding:84px 40px 150px}
.title{font-family:'Jua',sans-serif;font-size:clamp(28px,calc(var(--vh)*5),48px);margin:0;text-align:center}
.row{display:flex;gap:clamp(14px,calc(var(--vw)*2.4),32px);align-items:center;justify-content:center;flex-wrap:wrap}
.tap{border:4px solid #E3D9C7;background:#FFFFFF;border-radius:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:80px;min-height:80px;padding:8px}
.tap:disabled{cursor:default}
.scan{border-color:#2F6FB5 !important;box-shadow:0 0 0 6px rgba(47,111,181,.35);transform:scale(1.07)}
.hint{animation:hint 0.6s ease-in-out infinite;border-color:#F4B400 !important;box-shadow:0 0 0 8px rgba(244,196,49,.6)}
@keyframes hint{0%,100%{transform:rotate(0) scale(1.05)}25%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}
.picked{border-color:#2F6FB5 !important;background:#E8F1FA !important;box-shadow:0 0 0 8px rgba(47,111,181,.35);transform:scale(1.08)}
.dance{animation:dance 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes dance{0%,100%{transform:translateY(0) rotate(0)}20%{transform:translateY(-28px) rotate(-10deg)}40%{transform:translateY(0) rotate(0) scale(1.05,.95)}60%{transform:translateY(-28px) rotate(10deg)}80%{transform:translateY(0) rotate(0) scale(1.05,.95)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
.chomp{animation:chomp .5s}
@keyframes chomp{0%,100%{transform:scale(1)}25%{transform:scale(1.08,.9)}50%{transform:scale(.95,1.08)}75%{transform:scale(1.06,.94)}}
.plain.scan,.plain.picked{border-color:transparent !important;box-shadow:none !important;transform:none !important;background:transparent !important}
.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pop{animation:popin .45s}
@keyframes popin{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.gone{visibility:hidden}
/* corner buttons */
.corner{position:absolute;top:16px;width:64px;height:64px;border-radius:32px;border:none;background:#F6F1E7;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20}
.corner svg.ringsvg{position:absolute;inset:0}
#gear{right:20px}
#homeBtn{left:20px}
/* guide */
#guide{position:absolute;left:18px;bottom:14px;display:flex;align-items:flex-end;gap:10px;z-index:10;pointer-events:none;max-width:70vw}
#bubble{background:#FFFFFF;border:3px solid #2A2622;border-radius:22px;padding:12px 18px;font-family:'Jua',sans-serif;font-size:clamp(18px,calc(var(--vh)*3),26px);margin-bottom:46px;position:relative;max-width:56vw}
#bubble:empty{display:none}
/* fruit */
.panel{border-radius:28px;padding:18px;display:flex;align-items:center;justify-content:center}
.raven-path{display:flex;gap:14px;align-items:flex-end;background:#F6F1E7;border-radius:24px;padding:8px 22px 12px}
.step{width:86px;height:80px;border-radius:16px;background:#FFFFFF;border:3px solid #C9B48F;border-bottom:9px solid #A88B5C;box-shadow:0 3px 0 rgba(120,90,50,.15);display:flex;align-items:flex-end;justify-content:center;box-sizing:border-box}
.step.goal{background:#E6F4D9;border-color:#8CC271;border-bottom-color:#5E9E45}
.raven.hop{animation:hop .5s}
@keyframes hop{0%{transform:translate(-90px,0)}50%{transform:translate(-45px,-30px)}100%{transform:translate(0,0)}}
.attn{animation:attn 1.1s ease-in-out infinite;border-color:#2F6FB5 !important}
@keyframes attn{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
/* memory */
.card-back{background:#3D7CCB;border-color:#2A5E9E}
.card-done{opacity:.25}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(42,38,34,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.sheet{width:min(1100px,96vw);height:min(760px,94vh);background:#FFFBF3;border-radius:28px;display:flex;overflow:hidden}
.nav{width:250px;flex-shrink:0;background:#F6F1E7;padding:26px 16px;display:flex;flex-direction:column;gap:8px}
.navbtn{height:52px;border-radius:14px;border:none;background:transparent;text-align:left;padding:0 16px;font-size:17px;cursor:pointer}
.navbtn.on{background:#FFFFFF;color:#1F4F85;font-weight:700;box-shadow:inset 4px 0 0 #2F6FB5}
.pane{flex:1;padding:32px 40px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.box{background:#FFFFFF;border:2px solid #EFE6D6;border-radius:18px;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field .lab{display:flex;justify-content:space-between;font-weight:700;font-size:17px}
.field .val{color:#1F4F85}
input[type=range]{width:100%;height:32px;accent-color:#2F6FB5}
.radio{display:flex;align-items:center;gap:12px;font-size:17px}
.radio input{width:22px;height:22px;accent-color:#2F6FB5}
.btn{height:52px;border-radius:14px;border:2px solid #E3D9C7;background:#FFFFFF;font-size:16px;cursor:pointer}
.btn.primary{background:#2F6FB5;border-color:#2F6FB5;color:#FFFFFF;font-weight:700}
.muted{color:#5E554C;font-size:15px;line-height:1.6;margin:0}
.home-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;width:min(1100px,calc(var(--vw)*94))}
.tile{height:clamp(110px,calc(var(--vh)*17),150px);border-radius:22px}
.tile .nm{font-family:'Jua',sans-serif;font-size:clamp(16px,calc(var(--vh)*2.4),21px)}
.tile.soon{opacity:.45}
.tag{font-size:12px;background:#F6F1E7;border-radius:999px;padding:2px 10px;color:#5E554C}
.mlid{position:absolute;background:#fff;border-radius:50%;opacity:0;pointer-events:none;animation:mblink 4.2s infinite}@keyframes mblink{0%,91%,100%{opacity:0}92.5%,96%{opacity:1}}
.ld-bob{animation:ldbob 1s ease-in-out infinite;display:inline-block}@keyframes ldbob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-22px) rotate(3deg)}}.ld-dots{display:flex;gap:14px;margin-top:10px}.ld-dots span{width:20px;height:20px;border-radius:50%;background:#3D7CCB;animation:lddot 1s ease-in-out infinite}.ld-dots span:nth-child(2){background:#F4C431;animation-delay:.15s}.ld-dots span:nth-child(3){background:#E35D4B;animation-delay:.3s}@keyframes lddot{0%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-16px);opacity:1}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <button id="homeBtn" class="corner" aria-label="처음 화면 (길게 누르기)"></button>
  <button id="gear" class="corner" aria-label="보호자 설정 (3초 길게 누르기)"></button>
  <div id="guide"><div id="mongsil"></div><div id="bubble"></div></div>
</div>
<script>
// ---------- fit to screen ----------
let SC=1,DW=1280,DH=760;
function fit(){const base=760;SC=innerHeight/base;if(innerWidth/SC<1060)SC=innerWidth/1060;DW=innerWidth/SC;DH=innerHeight/SC;const app=document.getElementById('app');app.style.width=DW+'px';app.style.height=DH+'px';app.style.transform=`scale(${SC})`;document.documentElement.style.setProperty('--vw',(DW/100)+'px');document.documentElement.style.setProperty('--vh',(DH/100)+'px')}
fit();addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
// ---------- drawing ----------
function svg(inner,w,h,vb){return `<svg width="${w}" height="${h}" viewBox="${vb||'-30 -30 60 60'}" aria-hidden="true">${inner}</svg>`}
function speakerIcon(){return svg('<path d="M-14 -6 L-6 -6 L4 -14 L4 14 L-6 6 L-14 6 Z" fill="#2A2622"/><path d="M9 -7 Q15 0 9 7 M13 -12 Q23 0 13 12" fill="none" stroke="#2A2622" stroke-width="2.6" stroke-linecap="round"/>',60,60)}
function img(n,size,alt){return `<img src="sprites/${n}.png" alt="${alt||''}" draggable="false" style="width:${size}px;height:${size}px;object-fit:contain;pointer-events:none">`}
function mongsilImg(size,alt){const k=600/404,h=size/k,top=(size-h)/2;const eyes=[[0.325,0.4117],[0.5833,0.67]],y0=0.4752,y1=0.604,pad=0.012;const bw=Math.max(2,size*0.02);
  const lids=eyes.map(([x0,x1])=>{const l=(x0-pad)*size,w=(x1-x0+pad*2)*size,t=top+(y0-pad)*h,hh=(y1-y0+pad*2)*h;return `<span class="mlid" style="left:${l}px;top:${t}px;width:${w}px;height:${hh}px"><span style="position:absolute;left:12%;right:12%;top:28%;height:40%;border-bottom:${bw}px solid #5A2810;border-radius:0 0 50% 50%"></span></span>`}).join('');
  return `<span class="mwrap" style="position:relative;display:inline-block;width:${size}px;height:${size}px">${img('mongsil',size,alt)}${lids}</span>`}
const FRUITS={apple:{name:'사과',say:'빨간 사과',img:'apple'},pear:{name:'배',say:'노란 배',img:'pear'},plum:{name:'자두',say:'보라색 자두',img:'plum'},grape:{name:'청포도',say:'초록 청포도',img:'grapes'}};
function friendKeys(){return Object.keys(FRIENDS).filter(k=>k!=='diamond'||(S.age||3)>3)}
const FRIENDS={rabbit:{name:'토끼',img:'bigrabbit'},chick:{name:'병아리',img:'chick1'},bear:{name:'곰',img:'f_bear'},circle:{name:'빨간 동그라미',img:'f_circle'},tri:{name:'노란 세모',img:'f_tri'},square:{name:'파란 네모',img:'f_square'},diamond:{name:'초록 마름모',img:'f_diamond'}};

// ---------- settings ----------
const AGE_DEF={3:{scan:3,touchTime:10},4:{scan:2.5,touchTime:8},5:{scan:2.2,touchTime:6}};
const BASE={age:null,scan:3,touchTime:10,control:'both',voiceVol:80,fxVol:60,rounds:5,rate:0.9,pitch:1.5,gap:0.6,voiceName:''};
let S=Object.assign({},BASE);
try{const raw=localStorage.getItem('mongsil-settings');if(raw)Object.assign(S,JSON.parse(raw))}catch(e){}
function saveS(){try{localStorage.setItem('mongsil-settings',JSON.stringify(S))}catch(e){}}
const touchOn=()=>S.control!=='space', spaceOn=()=>S.control!=='touch';
let roundsPlayed=0;

// ---------- sound ----------
let actx=null;
function audio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(freqs,dur=0.15,type='sine',gap=0.12){const a=audio();if(!a||S.fxVol<=0)return;const v=S.fxVol/100*0.25;freqs.forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+i*gap;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05)})}
const sfx={tap:()=>tone([660],0.08,'triangle'),good:()=>tone([523,659,784],0.22,'triangle',0.11),soft:()=>tone([330,294],0.18,'sine',0.14),roll:()=>tone([400,450,500,550],0.06,'square',0.06),win:()=>tone([523,659,784,1047,784,1047],0.25,'triangle',0.13),flip:()=>tone([520],0.07,'sine')};
let koVoice=null;
function koVoices(){try{return speechSynthesis.getVoices().filter(v=>/ko/i.test(v.lang))}catch(e){return []}}
function pickVoice(){const vs=koVoices();const n=V().voiceName;koVoice=(n&&vs.find(v=>v.name===n))||vs[0]||null}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
let spQ=[],speaking=false,spGen=0,previewS=null;
const V=()=>previewS||S;
function hushSpeech(){spGen++;spQ=[];speaking=false;try{speechSynthesis.cancel()}catch(e){}}
function splitT(t){return String(t).split(/(?<=[!?.~])\s+|\s*\|\s*/).map(x=>x.trim()).filter(Boolean)}
const vkey=t=>String(t).replace(/[!?.~,\s]+$/,'').trim();
let VOICE=null;try{fetch('voice/manifest.json').then(r=>r.ok?r.json():null).then(m=>{if(m&&typeof m==='object')VOICE=m}).catch(()=>{})}catch(e){}
function eul(w){const c=String(w).charCodeAt(String(w).length-1)-0xAC00;return (c>=0&&c%28)?'을':'를'}
function nextSpeak(){const it=spQ.shift();if(!it){speaking=false;return}speaking=true;const g=spGen;let done=false;
  const fin=()=>{if(done||g!==spGen)return;done=true;clearTimeout(tm);setTimeout(()=>{if(g!==spGen)return;if(it.cb)it.cb();nextSpeak()},(V().gap||0)*1000)};
  let tm=setTimeout(fin,Math.max(600,it.t.length*(V().voiceVol>0?320:120)/(V().rate||1))+(V().voiceVol>0?2000:0));
  if(V().voiceVol<=0)return;
  const tts=()=>{try{const u=new SpeechSynthesisUtterance(it.t);u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=V().rate||0.85;u.pitch=V().pitch||1.2;u.volume=V().voiceVol/100;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){}};
  const f=VOICE&&VOICE[vkey(it.t)];
  if(f){try{const au=new Audio('voice/'+f);au.volume=V().voiceVol/100;au.onended=fin;au.onerror=tts;const p=au.play();if(p&&p.catch)p.catch(tts)}catch(e){tts()}}else tts()}
function speak(text,cb){const parts=splitT(text);if(!parts.length){if(cb)cb();return}const items=parts.map((p,i)=>({t:p,cb:i===parts.length-1?cb:null}));
  if(speaking){spQ=spQ.filter(x=>x.cb).concat(items)}else{spQ=items;nextSpeak()}}
function speakThen(text,cb){const t=token;speak(text,()=>{if(t===token&&!settingsOpen)cb()})}
function say(text,show,cb){document.getElementById('bubble').textContent=String(show===undefined?text:show).replace(/\s*\|\s*/g,' ');if(cb)speakThen(text,cb);else speak(text)}

// ---------- screen + timers ----------
const stage=document.getElementById('stage');
let token=0, chooser=null, settingsOpen=false;
function later(fn,ms){const t=token;const go=()=>{if(t!==token||settingsOpen)return;if(speaking){setTimeout(go,120);return}fn()};return setTimeout(go,ms)}
function show(html,noGuide){token++;document.querySelectorAll('[data-ov]').forEach(e=>e.remove());document.getElementById('guide').style.display=noGuide?'none':'flex';stopChooser();hushSpeech();stage.innerHTML=`<div class="screen">${html}</div>`;document.getElementById('bubble').textContent='';return stage.firstChild}
function stopChooser(){if(chooser){clearTimeout(chooser.timer);chooser.active=false;chooser.els.forEach(e=>e.classList.remove('scan'))}chooser=null}
function choose(els,onPick){stopChooser();els=els.filter(Boolean);const c={els,onPick,idx:-1,timer:null,active:true};els.forEach(e=>e.classList.remove('picked'));
  els.forEach((el,i)=>{el.onclick=()=>{if(!c.active||settingsOpen||!touchOn())return;audio();c.pick(i)}});
  c.pick=i=>{if(!c.active)return;c.active=false;clearTimeout(c.timer);els.forEach(e=>e.classList.remove('scan'));els[i].classList.add('picked');sfx.tap();onPick(i,els[i])};
  const step=()=>{if(!c.active)return;els.forEach(e=>e.classList.remove('scan'));if(els.length===1){c.idx=0;els[0].classList.add('scan');return}c.idx=(c.idx+1)%els.length;els[c.idx].classList.add('scan');c.timer=setTimeout(step,S.scan*1000)};
  if(spaceOn())step();chooser=c;return c}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();if(settingsOpen)return;audio();if(chooser&&chooser.active&&spaceOn()&&chooser.idx>=0)chooser.pick(chooser.idx)}},true);
function flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=n=>Math.floor(Math.random()*n);

// ---------- long press corners ----------
function ringSVG(){return `<svg class="ringsvg" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#2F6FB5" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="176" stroke-linecap="round" transform="rotate(-90 32 32)"/></svg>`}
function longPress(btn,ms,icon,fn){btn.innerHTML=icon+ringSVG();const ring=btn.querySelector('.ringsvg circle');let t=null;
  const start=e=>{e.preventDefault();ring.style.transition=`stroke-dashoffset ${ms}ms linear`;ring.style.strokeDashoffset='0';t=setTimeout(()=>{reset();fn()},ms)};
  const reset=()=>{clearTimeout(t);ring.style.transition='none';ring.style.strokeDashoffset='176'};
  btn.addEventListener('pointerdown',start);['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,reset));btn.addEventListener('click',e=>e.preventDefault())}
longPress(document.getElementById('gear'),3000,`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6B6259" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,openSettings);
longPress(document.getElementById('homeBtn'),1500,`<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6B6259" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>`,()=>{if(S.age)home();else ageScreen()});
document.getElementById('mongsil').innerHTML=mongsilImg(130,'몽실이');

// ---------- screens ----------
function ageScreen(){const el=show(`<h1 class="title">몇 살이에요?</h1><div class="row" id="ages"></div><p class="muted">숫자를 누르거나, 스페이스바를 눌러 골라요</p>`);
  const box=el.querySelector('#ages');const btns=[3,4,5].map(n=>{const b=document.createElement('button');b.className='tap';b.style.cssText='width:170px;height:200px';b.innerHTML=`<span class="jua" style="font-size:80px;line-height:1">${n}</span><span style="font-size:22px;letter-spacing:4px;color:#2F6FB5">${'●'.repeat(n)}</span>`;b.setAttribute('aria-label',n+'살');box.appendChild(b);return b});
  say('안녕! 나는 몽실이야. 몇 살이에요?');
  choose(btns,i=>{const age=[3,4,5][i];S.age=age;Object.assign(S,AGE_DEF[age]);saveS();say(KDET[age]+' 살이구나! 같이 놀자!');later(home,1600)})}

const GAMES=[['fruit','과일 따기','apple',fruitGame],['chick','병아리 세기','chick1',chickGame],['owl','부엉이 둥지로','owl',owlGame],['squirrel','다람쥐 도토리','squirrel',squirrelGame],['pop','깜짝 통','barrel2',popGame],['memory','짝 찾기','f_tri',memoryGame],['same','같은 그림 찾기','f_circle',sameGame],['bear','곰돌이 간식','bear',bearGame],['mole','두더지 잡기','mole',moleGame],['size','크다 작다','bigrabbit',sizeGame],['num','숫자 찾기',null,numberGame],['abc','ABC 찾기',null,abcGame],['kor','가나다 찾기',null,korGame]];

  function next(){clearT();q++;if(q>total){finishGame(spec.done);return}prog.textContent=q+' / '+total;
    secret.className='tap card-back';secret.innerHTML='<span class="jua" style="font-size:60px;color:#fff">?</span>';
    const g=spec.gen();cur=g.ans;const list=shuffle(g.opts);opts.innerHTML='';
    const btns=list.map(o=>{const b=B(`<span class="jua" style="font-size:clamp(48px,calc(var(--vh)*9),72px)">${o.label}</span>`,'width:clamp(110px,calc(var(--vw)*14),150px);height:clamp(130px,calc(var(--vh)*22),170px)',o.sound);opts.appendChild(b);return b});
    const ai=list.indexOf(cur);const cycle=S.scan*list.length;let limit,hintAt;
    if(S.control==='touch'){limit=S.touchTime;hintAt=S.touchTime/2}else if(S.control==='space'){limit=cycle*2;hintAt=cycle}else{limit=Math.max(S.touchTime,cycle*2);hintAt=Math.max(S.touchTime/2,cycle)}
    say(cur.sound+'! 어디 있을까?',spec.hideText?'잘 듣고 찾아 봐!':cur.sound+'!');const t=token;let wrong=0;
    timers.push(setTimeout(()=>{if(t!==token||settingsOpen||wrong>0)return;btns[ai].classList.add('hint');speak(cur.sound)},hintAt*1000));
    timers.push(setTimeout(()=>{if(t!==token||settingsOpen)return;stopChooser();btns[ai].classList.add('hint');reveal();say('정답은|'+cur.sound+(q<total?'! 다음 문제!':'!'),'정답은 '+cur.label);timers.push(setTimeout(()=>{if(t===token)next()},2600))},limit*1000));
    const ask=()=>choose(btns,i=>{if(i===ai){clearT();btns[i].classList.remove('hint');reveal();sfx.good();say('맞았어! '+(cur.word||cur.sound)+'!','맞았어! '+cur.label);timers.push(setTimeout(()=>{if(t===token)next()},1800))}else{wrong++;sfx.soft();btns[i].classList.remove('picked');flash(btns[i],'nope');if(wrong>=2)btns[ai].classList.add('hint');speak('다시 들어 봐. '+cur.sound);timers.push(setTimeout(()=>{if(t===token&&!settingsOpen)ask()},900))}});
    ask()}
  next()}
function pickOpts(pool,n,ans,extra){const set=[ans];if(extra&&!set.includes(extra))set.push(extra);for(const p of shuffle(pool)){if(set.length>=n)break;if(!set.includes(p))set.push(p)}return set}
function numberGame(){const cfg={3:{min:1,max:10,opts:3,confuse:false},4:{min:11,max:99,opts:4,confuse:false},5:{min:11,max:99,opts:4,confuse:true}}[S.age||3];
  const mk=n=>({label:String(n),sound:kor(n)});
  quizGame({done:'숫자를 잘 찾았어!',gen(){const a=cfg.min+rnd(cfg.max-cfg.min+1);const pool=[];for(let i=cfg.min;i<=cfg.max;i++)pool.push(i);let ex=null;if(cfg.confuse&&a%10){const r=(a%10)*10+Math.floor(a/10);if(r>=cfg.min&&r<=cfg.max&&r!==a)ex=r}
    const nums=pickOpts(pool,cfg.opts,a,ex);const objs=nums.map(mk);return {ans:objs[0],opts:objs}}})}
const ABC=[['A','에이','에이, 애플'],['B','비','비, 바나나'],['C','씨','씨, 캣'],['D','디','디, 독'],['E','이','이, 에그'],['F','에프','에프, 피시'],['G','지','지, 고릴라'],['H','에이치','에이치, 햇'],['I','아이','아이, 아이스크림'],['J','제이','제이, 주스'],['K','케이','케이, 키'],['L','엘','엘, 라이언'],['M','엠','엠, 문'],['N','엔','엔, 노즈'],['O','오','오, 오렌지'],['P','피','피, 피그'],['Q','큐','큐, 퀸'],['R','알','알, 래빗'],['S','에스','에스, 선'],['T','티','티, 트리'],['U','유','유, 엄브렐라'],['V','브이','브이, 바이올린'],['W','더블유','더블유, 워터'],['X','엑스','엑스, 폭스'],['Y','와이','와이, 요요'],['Z','지','지, 지브라']];
function abcGame(){const age=S.age||3;const pool=age===3?ABC.slice(0,10):ABC;const n={3:3,4:4,5:4}[age];
  const lowerMix=age===5;
  quizGame({done:'알파벳을 잘 찾았어!',gen(){const a=pool[rnd(pool.length)];const others=shuffle(pool.filter(x=>x[0]!==a[0]&&x[1]!==a[1])).slice(0,n-1);
    const mk=(x,low)=>({label:low?x[0].toLowerCase():x[0],sound:x[1],word:x[2]});const low=lowerMix&&Math.random()<0.5;const objs=[a,...others].map(x=>mk(x,low));return {ans:objs[0],opts:objs}}})}
const GANA=[['가','가방'],['나','나비'],['다','다리'],['라','라면'],['마','마스크'],['바','바나나'],['사','사과'],['아','아기'],['자','자동차'],['차','차'],['카','카메라'],['타','타조'],['파','파도'],['하','하마']];
const GANA_B=[['각','각도기'],['난','난초'],['달','달'],['말','말'],['밤','밤'],['산','산'],['강','강아지'],['곰','곰'],['눈','눈'],['별','별']];
function korGame(){const age=S.age||3;const n={3:3,4:4,5:4}[age];const pool=age===5?GANA.concat(GANA_B):GANA;
  quizGame({done:'한글을 잘 찾았어!',hideText:true,gen(){const a=pool[rnd(pool.length)];const others=shuffle(pool.filter(x=>x[0]!==a[0])).slice(0,n-1);const objs=[a,...others].map(x=>({label:x[0],sound:x[0],word:x[0]+', '+x[1]}));return {ans:objs[0],opts:objs}}})}

// ---------- settings ----------

// ---------- app install (PWA) ----------
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e});
addEventListener('appinstalled',()=>{installEvt=null});
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let swOK=false;
try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){navigator.serviceWorker.register('sw.js').then(()=>{swOK=true}).catch(()=>{})}}catch(e){}
function installPane(){
  if(isStandalone())return '<p class="muted">이미 앱으로 실행 중이에요. 인터넷이 없어도 놀 수 있어요.</p>';
  if(installEvt)return '<p class="muted">버튼을 누르면 이 기기에 앱으로 설치돼요. 설치하면 홈 화면 아이콘으로 바로 열리고, 인터넷이 없어도 놀 수 있어요.</p><button class="btn primary" id="doInstall" style="max-width:260px">앱으로 설치하기</button>';
  if(isIOS())return '<p class="muted">아이폰과 아이패드는 Safari에서 설치해요.</p><ol class="muted" style="line-height:1.9"><li>Safari로 이 주소를 열어요.</li><li>아래쪽(아이패드는 위쪽) 공유 버튼을 눌러요.</li><li>"홈 화면에 추가"를 눌러요.</li></ol>';
  return swOK?'<p class="muted">브라우저 메뉴(⋮)에서 "앱 설치" 또는 "홈 화면에 추가"를 누르면 설치돼요.</p>':'<p class="muted">지금 화면에서는 설치할 수 없어요. 앱 설치 파일을 웹 주소(https)에 올린 뒤 그 주소를 열면 설치할 수 있어요.</p>';
}

function openSettings(){settingsOpen=true;token++;stopChooser();hushSpeech();
  const draft=Object.assign({},S);if(!draft.age)draft.age=3;
  const ov=document.createElement('div');ov.className='overlay';ov.innerHTML=`<div class="sheet" role="dialog" aria-label="보호자 설정"><nav class="nav" aria-label="설정 메뉴"><p class="jua" style="font-size:28px;margin:0 0 14px 10px">보호자 설정</p><div id="tabs" style="display:flex;flex-direction:column;gap:6px"></div><div style="flex:1"></div><button class="btn" id="reset">기본값으로 되돌리기</button><button class="btn primary" id="save">저장하고 게임으로</button></nav><div class="pane" id="pane"></div></div>`;
  document.body.appendChild(ov);const pane=ov.querySelector('#pane'),tabs=ov.querySelector('#tabs');
  const TABS=[['age','나이와 난이도'],['time','시간'],['control','조작'],['sound','소리'],['rest','쉬는 시간'],['app','앱 설치']];let tab='time';
  function range(id,label,min,max,step,val,unit,onIn){return `<div class="field"><div class="lab"><label for="${id}">${label}</label><span class="val" id="${id}v">${val}${unit}</span></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`}
  function bindRange(id,key,unit,num=parseFloat){const i=pane.querySelector('#'+id);if(!i)return;i.addEventListener('input',()=>{draft[key]=num(i.value);pane.querySelector('#'+id+'v').textContent=i.value+unit;if(key==='scan'||key==='touchTime')paint()})}
  function paint(){tabs.innerHTML='';TABS.forEach(([id,l])=>{const b=document.createElement('button');b.className='navbtn'+(tab===id?' on':'');b.textContent=l;b.onclick=()=>{tab=id;paint()};tabs.appendChild(b)});
    let h='';
    if(tab==='age'){h=`<h2 class="jua" style="margin:0;font-size:32px">나이와 난이도</h2><p class="muted">나이를 바꾸면 시간 설정도 그 나이의 기본값으로 바뀌어요. 게임 난이도는 나이에 따라 자동으로 정해져요.</p><div class="row" style="justify-content:flex-start">${[3,4,5].map(n=>`<button class="tap${draft.age===n?' picked':''}" data-age="${n}" aria-pressed="${draft.age===n}" style="width:120px;height:80px"><span class="jua" style="font-size:30px">${n}세</span></button>`).join('')}</div>`}
    if(tab==='time'){const cyc=Math.round(draft.scan*3*10)/10;h=`<h2 class="jua" style="margin:0;font-size:32px">시간</h2><p class="muted">아이가 자주 놓치면 늘리고, 지루해하면 줄이세요.</p><div class="box">${range('scan','스페이스바 깜박임: 카드 한 장에 머무는 시간',1,5,0.1,draft.scan,'초')}${range('tt','미니게임 한 문제 시간 (터치)',5,30,1,draft.touchTime,'초')}<p class="muted">힌트는 한 문제 시간의 절반이 지나면 나와요. 스페이스바로 할 때는 불빛이 두 바퀴 도는 시간으로 자동 계산해요(카드 3장이면 ${cyc*2}초, 힌트 ${cyc}초).</p></div>`}
    if(tab==='control'){h=`<h2 class="jua" style="margin:0;font-size:32px">조작</h2><div class="box">${[['both','터치와 스페이스바 둘 다'],['touch','터치만'],['space','스페이스바만']].map(([v,l])=>`<label class="radio"><input type="radio" name="ctl" value="${v}" ${draft.control===v?'checked':''}>${l}</label>`).join('')}</div><p class="muted">터치만 고르면 깜박임이 꺼져요. 스페이스바만 고르면 화면을 눌러도 반응하지 않아요.</p>`}
    if(tab==='sound'){const vs=koVoices();h=`<h2 class="jua" style="margin:0;font-size:32px">소리</h2><div class="box">${range('vv','몽실이 목소리 크기',0,100,5,draft.voiceVol,'')}${range('rt','말 빠르기 (1이 보통)',0.5,1.3,0.05,draft.rate,'')}${range('pt','목소리 높이 (1이 보통)',0.6,1.8,0.1,draft.pitch,'')}${range('gp','문장 사이 쉬는 시간',0,2,0.1,draft.gap,'초')}<div class="field"><label class="lab" for="vn">목소리 종류</label><select id="vn" style="height:48px;border-radius:12px;border:2px solid #E3D9C7;font-size:16px;padding:0 10px"><option value="">기본 목소리</option>${vs.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${draft.voiceName===v.name?'selected':''}>${v.name}</option>`).join('')}</select>${vs.length?'':'<p class="muted">이 기기에서 한국어 목소리를 찾지 못했어요.</p>'}</div><button class="btn" id="tryv" style="align-self:flex-start;padding:0 22px">들어보기</button>${range('fx','효과음 크기',0,100,5,draft.fxVol,'')}</div><p class="muted">몽실이 목소리는 지금은 기기에 들어 있는 읽어주기 음성을 써요. 기기에 한국어 음성이 없으면 소리가 나지 않을 수 있어요.</p>`}
    if(tab==='rest'){h=`<h2 class="jua" style="margin:0;font-size:32px">쉬는 시간</h2><div class="box">${range('rd','몇 판 하면 몽실이가 쉬자고 할까요',1,10,1,draft.rounds,'판')}<p class="muted">게임 하나를 끝까지 하면 1판이에요. 지금까지 ${roundsPlayed}판 했어요.</p></div>`}
    if(tab==='app'){h=`<h2 class="jua" style="margin:0;font-size:32px">앱 설치</h2><div class="box">${installPane()}</div>`}
    pane.innerHTML=h;
    const di=pane.querySelector('#doInstall');if(di)di.onclick=async()=>{try{installEvt.prompt();await installEvt.userChoice}catch(e){}installEvt=null;paint()};
    pane.querySelectorAll('[data-age]').forEach(b=>b.onclick=()=>{const n=+b.dataset.age;draft.age=n;Object.assign(draft,AGE_DEF[n]);paint()});
    pane.querySelectorAll('input[name=ctl]').forEach(r=>r.onchange=()=>{draft.control=r.value});
    bindRange('scan','scan','초');bindRange('tt','touchTime','초',v=>parseInt(v));bindRange('vv','voiceVol','',v=>parseInt(v));bindRange('fx','fxVol','',v=>parseInt(v));bindRange('rd','rounds','판',v=>parseInt(v));bindRange('rt','rate','');bindRange('pt','pitch','');bindRange('gp','gap','초');
    const vn=pane.querySelector('#vn');if(vn)vn.onchange=()=>{draft.voiceName=vn.value};
    const tv=pane.querySelector('#tryv');if(tv)tv.onclick=()=>{hushSpeech();previewS=Object.assign({},S,draft);pickVoice();speak('안녕! 나는 몽실이야. 모두 세 마리! 숫자를 찾아 보자.',()=>{previewS=null;pickVoice()})}}
  paint();
  ov.querySelector('#reset').onclick=()=>{const age=draft.age;Object.assign(draft,BASE,{age},AGE_DEF[age]);paint()};
  ov.querySelector('#save').onclick=()=>{previewS=null;Object.assign(S,draft);saveS();pickVoice();ov.remove();settingsOpen=false;home()}}

// ---------- start ----------
function startScreen(){const el=show(`<div style="font-size:0">${mongsilImg(280,'몽실이')}</div><h1 class="title">몽실이와 놀이터</h1><button class="tap" id="go" style="width:220px;height:110px"><span class="jua" style="font-size:40px">시작!</span></button>`,true);
  choose([el.querySelector('#go')],()=>{audio();if(S.age)home();else ageScreen()})}
startScreen();setTimeout(preloadAll,2000);
</script>
